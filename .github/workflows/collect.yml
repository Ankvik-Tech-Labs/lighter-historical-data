name: collect-lighter-data

# Collects the FULL historical Lighter DEX dataset — every supported timeframe
# (1m,5m,15m,30m,1h,4h,12h,1d,1w) OHLCV + hourly funding for all perps — and
# publishes it to a rolling `latest` GitHub Release (one zip per timeframe).
#
# Lighter rate-limits at 60 req/min PER IP. GitHub matrix jobs run on separate
# runners (separate IPs), so each timeframe is sharded across N parallel jobs —
# N× the single-IP ceiling. Fine timeframes (1m/5m/15m) get many shards to stay
# under the 6h job cap; coarse ones (1d/1w) need just one. A `setup` job emits
# the (tf, shard, shards) matrix; `publish` merges every shard and rebuilds the
# release assets + notes (which carry the data timerange).

on:
  # Vitalik8 owns scheduled collection; use this only for manual recovery.
  workflow_dispatch: {}

permissions:
  contents: write              # create/update Releases

concurrency:
  group: collect-lighter-data
  cancel-in-progress: false

env:
  PY_VERSION: "3.13"
  # Per-timeframe shard counts (fine TFs need more shards to fit the 6h job cap).
  # Edit here to tune throughput; the matrix is generated from this map.
  SHARD_MAP: '{"1w":1,"1d":1,"12h":1,"4h":1,"1h":2,"30m":3,"15m":8,"5m":8,"1m":20}'

jobs:
  setup:
    name: build matrix
    runs-on: ubuntu-latest
    outputs:
      ohlcv: ${{ steps.gen.outputs.ohlcv }}
    steps:
      - id: gen
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          shards = json.loads(os.environ["SHARD_MAP"])
          inc = [{"tf": tf, "shard": i, "shards": n} for tf, n in shards.items() for i in range(n)]
          print("ohlcv=" + json.dumps({"include": inc}))
          PY

  ohlcv:
    name: ohlcv ${{ matrix.tf }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350       # under the 6h hard cap
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.setup.outputs.ohlcv) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seed prior ${{ matrix.tf }} from latest release (incremental delta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior/futures
          if gh release download latest -R "${{ github.repository }}" --pattern "lighter-${{ matrix.tf }}.zip" --dir prior 2>/dev/null; then
            unzip -q -o "prior/lighter-${{ matrix.tf }}.zip" -d prior/futures
            echo "seeded $(ls prior/futures | wc -l) prior ${{ matrix.tf }} feathers — fetching delta only"
          else
            echo "no prior ${{ matrix.tf }} release asset — full backfill"
          fi
      - name: Collect ${{ matrix.tf }} (shard ${{ matrix.shard }}/${{ matrix.shards }})
        run: |
          python collector/collect_ohlcv.py \
            --timeframe ${{ matrix.tf }} \
            --shard ${{ matrix.shard }}/${{ matrix.shards }} \
            --out data/futures \
            --prior-dir prior/futures
      - uses: actions/upload-artifact@v4
        with:
          name: ohlcv-${{ matrix.tf }}-${{ matrix.shard }}
          path: data/futures/
          retention-days: 1
          if-no-files-found: warn

  funding:
    name: funding ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect funding (shard ${{ matrix.shard }}/8)
        run: python collector/collect_funding.py --shard ${{ matrix.shard }}/8 --out data/funding
      - uses: actions/upload-artifact@v4
        with:
          name: funding-${{ matrix.shard }}
          path: data/funding/
          retention-days: 1
          if-no-files-found: warn

  publish:
    name: merge + publish rolling 'latest' release
    needs: [ohlcv, funding]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download OHLCV shards
        uses: actions/download-artifact@v4
        with:
          pattern: ohlcv-*
          path: _staging/futures
          merge-multiple: true
      - name: Download funding shards
        uses: actions/download-artifact@v4
        with:
          pattern: funding-*
          path: _staging/funding
          merge-multiple: true

      - name: Package per-timeframe zips + manifest + notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # one zip per timeframe actually present
          for tf in 1m 5m 15m 30m 1h 4h 12h 1d 1w; do
            if ls _staging/futures/*-${tf}-futures.feather >/dev/null 2>&1; then
              (cd _staging/futures && zip -q -j "../../dist/lighter-${tf}.zip" *-${tf}-futures.feather)
              echo "packed lighter-${tf}.zip"
            fi
          done
          if ls _staging/funding/*.parquet >/dev/null 2>&1; then
            (cd _staging/funding && zip -q -j ../../dist/lighter-funding.zip *.parquet)
            echo "packed lighter-funding.zip"
          fi
          python collector/make_manifest.py \
            --futures _staging/futures --funding _staging/funding \
            --out dist/manifest.json --notes dist/release_notes.md
          ls -lh dist/

      - name: Publish to rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Lighter historical data (latest)" --notes-file dist/release_notes.md --latest
          gh release edit latest --title "Lighter historical data (latest)" --notes-file dist/release_notes.md --latest
          gh release upload latest dist/*.zip dist/manifest.json --clobber
